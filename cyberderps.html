            vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
            float n_ = 0.142857142857;
            vec3 ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_);
            vec4 x = x_ * ns.x + ns.yyyy;
            vec4 y = y_ * ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4(x.xy, y.xy);
            vec4 b1 = vec4(x.zw, y.zw);
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2,p2), dot(p3,p3)));
            p0 *= norm.x;
            p1 *= norm.y;
            p2 *= norm.z;
            p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot(m*m, vec4(dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3)));
        }

        // --- EFFECTS DEFINITIONS ---

        vec4 effect_ChannelSwap(vec4 color, float seed) { float speed = mix(0.5, 2.0, seed); float time_seed = mod(time * speed, 3.0); if (time_seed < 1.0) return vec4(color.g, color.b, color.r, color.a); if (time_seed < 2.0) return vec4(color.b, color.r, color.g, color.a); return vec4(color.g, color.r, color.b, color.a); }
        vec4 effect_Posterize(vec4 color, float seed) { float speed = mix(2.0, 5.0, seed); float numColors = floor(mix(5.0, 20.0, seed)) + sin(time * speed) * 4.0; return floor(color * numColors) / numColors; }
        vec4 effect_PixelSort(vec2 uv, float seed) { float t = mix(0.1, 0.4, seed); float d = floor(mix(10.0, 50.0, u_intensity * seed)); vec2 dir = vec2(1.0/1024.0, 0.0); vec2 f_uv = uv; for (float i = 1.0; i < 30.0; i++) { if(i>=d) break; vec2 s_uv = uv + dir * i; if(s_uv.x>1.0) break; if(luma(texture2D(tDiffuse, s_uv).rgb)<t) break; f_uv = s_uv; } return texture2D(tDiffuse, f_uv); }
        vec4 effect_Thermal(vec4 color, float seed) { float brightness = luma(color.rgb); vec3 t = vec3(1.0, 0.0, 0.0); if (brightness > 0.8) t = vec3(1.0, 1.0, 1.0); else if (brightness > 0.5) t = vec3(1.0, 1.0, 0.0); else if (brightness > 0.2) t = vec3(0.0, 0.0, 1.0); else t = vec3(0.0, 0.0, 0.0); return mix(color, vec4(t, color.a), 0.85); }
        vec4 effect_WaveDistort(vec2 uv, float seed) { vec2 distorted_uv = uv; float freq = mix(5.0, 30.0, seed); float amp = mix(0.01, 0.05, seed) * u_intensity; distorted_uv.x += sin(distorted_uv.y * freq + time * 1.5) * amp; return texture2D(tDiffuse, distorted_uv); }
        vec4 effect_RGBShift(vec2 uv, float seed) { float s = mix(0.005, 0.03, seed) * u_intensity; return vec4(texture2D(tDiffuse, vec2(uv.x+s, uv.y)).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, vec2(uv.x-s, uv.y)).b, 1.0); }
        vec4 effect_Pixelate(vec2 uv, float seed) { float b = floor(mix(50.0, 150.0, seed) * (1.0 - u_intensity * 0.5)); if(b<2.0) return texture2D(tDiffuse, uv); return texture2D(tDiffuse, floor(uv*b)/b); }
        vec4 effect_Noise(vec4 c, vec2 uv, float s) { float n = (rand(uv+time)-0.5) * mix(0.2, 0.7, s) * u_intensity; return c + n; }
        vec4 effect_Tear(vec2 uv, float s) { if(rand(vec2(floor(uv.y*50.0), time)) < mix(0.05, 0.5, s)*u_intensity) uv.x += (rand(vec2(uv.y, time))-0.5)*0.1; return texture2D(tDiffuse, uv); }
        vec4 effect_Shear(vec2 uv, vec4 region, float seed) { if (u_safe_mode) return texture2D(tDiffuse, uv); float speed = mix(1.0, 3.0, seed); vec2 sheared_uv = uv; float shear_factor = (mix(-0.5, 0.5, seed)) * u_intensity * sin(time * speed); float progress = (uv.y - region.y) / region.w; sheared_uv.x += progress * shear_factor; return texture2D(tDiffuse, sheared_uv); }
        vec4 effect_SlitScan(vec2 uv, float seed) { float p=fract(time*0.2+seed); if(abs(uv.y-p)<0.1*u_intensity) return texture2D(tDiffuse, vec2(uv.x+sin(time)*0.1,uv.y)); return texture2D(tDiffuse, uv); }
        vec4 effect_Strobe(vec4 c, float s) { if (u_safe_mode) return c; return mix(c, vec4(1.0), step(0.5, sin(time * mix(5.0, 20.0, s))) * u_intensity); }
        vec4 effect_ChromaticAberration(vec2 uv, float s) { float a=mix(0.001,0.02,s)*u_intensity*(1.0+sin(time*2.0)*0.8); return vec4(texture2D(tDiffuse, vec2(uv.x+a,uv.y+a)).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, vec2(uv.x-a,uv.y-a)).b, 1.0); }
        vec4 effect_PixelStretch(vec2 uv, float seed) { vec4 color = texture2D(tDiffuse, uv); float brightness = luma(color.rgb); float threshold = mix(0.2, 0.8, seed); float stretch = smoothstep(threshold, 1.0, brightness) * (sin(time * mix(5.0, 20.0, seed) + uv.y * 10.0) + 1.0) * 2.0 * u_intensity; vec2 stretched_uv = vec2(uv.x + stretch, uv.y); return texture2D(tDiffuse, stretched_uv); }
        vec4 effect_Dither(vec4 color, vec2 uv, float seed) { mat4 bayerMatrix = mat4(0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0) / 16.0; float brightness = luma(color.rgb); vec2 coord = floor(mod(gl_FragCoord.xy, 4.0)); float threshold = bayerMatrix[int(coord.x)][int(coord.y)]; vec3 ditheredColor = vec3(step(threshold, brightness)); return mix(color, vec4(ditheredColor, color.a), u_intensity * mix(0.5, 1.0, seed)); }
        vec4 effect_SlitScanVertical(vec2 uv, float seed) { float scan_pos = fract(time + seed); float scan_width = 0.05 * u_intensity; if (abs(uv.x - scan_pos) < scan_width) return texture2D(tDiffuse, vec2(scan_pos, uv.y)); return texture2D(tDiffuse, uv); }
        vec4 effect_ScanlinesEffect(vec4 color, vec2 uv, float seed) { float frequency = mix(400.0, 1000.0, seed); float intensity = mix(0.05, 0.2, seed) * u_intensity; float scanline = sin((uv.y + time * 0.1) * frequency) * intensity; return color - scanline; }
        vec4 effect_Jitter(vec2 uv, float seed) { float bands = floor(mix(20.0, 60.0, seed)); float band_index = floor(uv.y * bands); float strength = mix(0.005, 0.05, seed) * u_intensity; float offset = (rand(vec2(band_index, floor(time * 10.0))) - 0.5) * strength; return texture2D(tDiffuse, uv + vec2(offset, 0.0)); }
        vec4 effect_HueCycle(vec4 color, float seed) { vec3 hsv = rgb2hsv(color.rgb); float speed = mix(0.1, 0.5, seed); hsv.x = fract(hsv.x + time * speed); vec3 rgb = hsv2rgb(hsv); return vec4(rgb, color.a); }
        vec4 effect_LCD(vec2 uv, float seed) { float scale = mix(150.0, 300.0, fract(seed * 1.234)); vec2 pixel_uv = uv * scale; vec2 pixel_frac = fract(pixel_uv); float pixel_width = 1.0 / scale; vec2 red_uv_offset = vec2(pixel_width * 0.333, 0.0); vec2 blue_uv_offset = vec2(-pixel_width * 0.333, 0.0); float r = texture2D(tDiffuse, uv - red_uv_offset).r; float g = texture2D(tDiffuse, uv).g; float b = texture2D(tDiffuse, uv - blue_uv_offset).b; vec3 color = vec3(r, g, b); float grid_intensity = mix(0.3, 0.8, fract(seed * 2.345)); if (pixel_frac.x < 0.1 || pixel_frac.y < 0.1) color *= grid_intensity; return vec4(color, 1.0); }
        vec4 effect_8Bit(vec4 color, float seed) { float speed = mix(2.0, 5.0, seed); float numColors = floor(mix(2.0, 8.0, seed) + sin(time * speed) * 2.0); return floor(color * numColors) / numColors; }
        vec4 effect_ASCII(vec2 uv, float seed) { float scale = mix(80.0, 150.0, seed); vec2 charUV = floor(uv * scale) / scale; vec4 color = texture2D(tDiffuse, charUV); float brightness = luma(color.rgb); float charLevel = floor(brightness * 4.0) / 4.0; return vec4(vec3(charLevel), 1.0); }
        vec4 effect_PerlinNoise(vec2 uv, float seed) { float scale = mix(5.0, 15.0, seed); float noise = snoise(vec3(uv * scale, time * 0.2)); vec2 distortedUv = uv + vec2(noise, noise) * 0.05 * u_intensity; return texture2D(tDiffuse, distortedUv); }
        vec4 effect_LumaMesh(vec2 uv, float seed) { float speed = mix(0.5, 2.0, seed); float gridSize = mix(10.0, 40.0, seed) * (1.0 + u_intensity * 2.0) * (1.0 + sin(time * speed) * 0.1); vec2 step = vec2(1.0 / 1024.0, 1.0 / 1024.0); vec4 color = texture2D(tDiffuse, uv); float currentLuma = luma(color.rgb); float rightLuma = luma(texture2D(tDiffuse, uv + vec2(step.x, 0.0)).rgb); float bottomLuma = luma(texture2D(tDiffuse, uv + vec2(0.0, step.y)).rgb); float diffX = abs(currentLuma - rightLuma); float diffY = abs(currentLuma - bottomLuma); vec2 gridUV = fract(uv * gridSize); float lineThickness = 0.1; float lineX = smoothstep(lineThickness, 0.0, abs(gridUV.x - 0.5) * 2.0); float lineY = smoothstep(lineThickness, 0.0, abs(gridUV.y - 0.5) * 2.0); float threshold = mix(0.02, 0.25, 1.0 - seed); float mesh = 0.0; if (diffX > threshold) mesh = max(mesh, lineY); if (diffY > threshold) mesh = max(mesh, lineX); float vividness = pow(mesh, 0.5) * 2.0; return mix(color, vec4(0.0, 1.0, 0.2, 1.0), clamp(vividness, 0.0, 1.0) * u_intensity); }
        vec4 effect_VHS(vec2 uv, vec4 color, float seed) { float shift = mix(0.01, 0.05, seed) * u_intensity; float r = texture2D(tDiffuse, vec2(uv.x + shift, uv.y)).r; float b = texture2D(tDiffuse, vec2(uv.x - shift, uv.y)).b; vec3 shiftedColor = vec3(r, color.g, b); float speed = mix(1.0, 4.0, seed); float distortion = sin(uv.y * 300.0 + time * speed) * 0.02 * u_intensity; if (rand(vec2(floor(uv.y * 25.0), time * 0.5)) < 0.15 * u_intensity) distortion *= 15.0; vec2 distortedUv = uv + vec2(distortion, 0.0); vec4 finalColor = texture2D(tDiffuse, distortedUv); finalColor.rgb = mix(finalColor.rgb, shiftedColor, 0.6); finalColor.rgb -= sin(uv.y * 1024.0 * 0.9) * mix(0.1, 0.25, seed); finalColor.rgb += (rand(uv + time) - 0.5) * mix(0.15, 0.5, seed) * u_intensity; return clamp(finalColor, 0.0, 1.0); }
        vec4 effect_FindEdges(vec2 uv, float seed) { float threshold = mix(0.1, 0.5, seed); vec2 pixelStep = vec2(1.0/1024.0, 1.0/1024.0); float l = luma(texture2D(tDiffuse, uv - pixelStep).rgb); float r = luma(texture2D(tDiffuse, uv + pixelStep).rgb); float u = luma(texture2D(tDiffuse, uv - vec2(0.0, pixelStep.y)).rgb); float d = luma(texture2D(tDiffuse, uv + vec2(0.0, pixelStep.y)).rgb); float edge = pow(pow(r - l, 2.0) + pow(u - d, 2.0), 0.5); return vec4(vec3(step(threshold, edge)), 1.0); }
        vec4 effect_MovingLines(vec4 color, vec2 uv, float seed) { float density = mix(0.1, 1.5, fract(seed * 10.0)); float speed = mix(0.1, 2.0, fract(seed * 100.0)); float phaseStart = time * speed; vec3 source_color = texture2D(tDiffuse, uv).rgb; float brightness = luma(source_color); float phase = brightness * density + phaseStart; float line_thickness = 0.05 * u_intensity; float line = 1.0 - smoothstep(0.0, line_thickness, fract(phase)); float fade = abs(sin(time * PI * 0.5)); line *= fade; return mix(color, vec4(1.0), line); }
        vec4 effect_PencilSketch(vec2 uv, float seed) { vec2 pixelStep = vec2(1.0/1024.0, 1.0/1024.0); vec4 originalColor = texture2D(tDiffuse, uv); float luma_base = luma(originalColor.rgb); float blur_strength = mix(1.0, 4.0, seed); float luma_inverted_blurred = 0.0; luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(-1.0, -1.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(0.0, -1.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(1.0, -1.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(-1.0, 0.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(0.0, 0.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(1.0, 0.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(-1.0, 1.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(0.0, 1.0) * blur_strength).rgb)); luma_inverted_blurred += (1.0 - luma(texture2D(tDiffuse, uv + pixelStep * vec2(1.0, 1.0) * blur_strength).rgb)); luma_inverted_blurred /= 9.0; float sketch = luma_base / (1.0 - luma_inverted_blurred + 0.001); float noise = rand(uv) * 0.1; vec3 sketch_color = vec3(clamp(sketch - noise, 0.0, 1.0)); return mix(originalColor, vec4(sketch_color, 1.0), u_intensity); }
        vec4 effect_Glow(vec2 uv, float seed) { vec4 originalColor = texture2D(tDiffuse, uv); vec3 finalColor = vec3(0.0); float radius = mix(2.0, 8.0, seed); float brightness_threshold = mix(0.6, 0.95, 1.0 - seed); float glow_intensity = mix(0.5, 1.5, seed) * u_intensity; vec2 pixelStep = vec2(1.0/1024.0, 1.0/1024.0); for (float x = -3.0; x <= 3.0; x++) { for (float y = -3.0; y <= 3.0; y++) { vec2 offset = vec2(x, y) * pixelStep; vec3 sampleColor = texture2D(tDiffuse, uv + offset).rgb; if (luma(sampleColor) > brightness_threshold) finalColor += sampleColor; } } finalColor /= 49.0; return vec4(originalColor.rgb + finalColor * glow_intensity, 1.0); }
        vec4 effect_MeltingLines(vec2 uv, float seed) { float melt_speed = mix(0.1, 0.5, seed); float melt_amount = texture2D(tDiffuse, vec2(uv.x, uv.y - fract(time * melt_speed))).r * 0.2 * u_intensity; vec2 melted_uv = uv - vec2(0.0, melt_amount); return texture2D(tDiffuse, melted_uv); }
        vec4 effect_BlockDisplacement(vec2 uv, float seed) { float grid_size = floor(mix(10.0, 30.0, seed)); vec2 block_uv = floor(uv * grid_size) / grid_size; vec2 displacement = vec2(rand(block_uv) - 0.5, rand(block_uv + 0.1) - 0.5) * 0.05 * u_intensity; return texture2D(tDiffuse, uv + displacement); }

        // --- MAIN PIPELINE ---
        void main() {
            vec2 uv = vUv;
            
            if (u_apply_crt && !u_safe_mode) {
                uv.y = fract(uv.y + u_v_offset);
            }

            vec4 region = vec4(0.0, 0.0, 1.0, 1.0); 
            vec4 final_color = texture2D(tDiffuse, uv);
            vec4 effect_color = final_color;

            bool inRegion = (uv.x >= u_glitch_region.x && uv.x <= u_glitch_region.x + u_glitch_region.z &&
                             uv.y >= u_glitch_region.y && uv.y <= u_glitch_region.y + u_glitch_region.w);

            float chunk = floor((uv.x - u_glitch_region.x) / u_glitch_region.z * 12.0);
            float letter_active = step(0.4, rand(vec2(chunk, floor(time * 5.0 + u_effect_seed))));

            bool isFullScreen = (
                u_active_effect == 2 || u_active_effect == 4 || u_active_effect == 7 || 
                u_active_effect == 8 || u_active_effect == 17 || 
                u_active_effect == 19 || u_active_effect == 21 || u_active_effect == 22 || 
                u_active_effect == 23 || u_active_effect == 24 || u_active_effect == 25 || 
                u_active_effect == 27 || u_active_effect == 28 || u_active_effect == 29 ||
                u_active_effect == 31 || u_active_effect == 32

            if (isFullScreen || (inRegion && letter_active > 0.0)) {
                if(u_active_effect == 1) effect_color = effect_ChannelSwap(final_color, u_effect_seed);
                else if(u_active_effect == 2) effect_color = effect_Posterize(final_color, u_effect_seed);
                else if(u_active_effect == 3) effect_color = effect_PixelSort(uv, u_effect_seed);
                else if(u_active_effect == 4) effect_color = effect_Thermal(final_color, u_effect_seed);
                else if(u_active_effect == 5) effect_color = effect_WaveDistort(uv, u_effect_seed);
                else if(u_active_effect == 6) effect_color = effect_RGBShift(uv, u_effect_seed);
                else if(u_active_effect == 7) effect_color = effect_Pixelate(uv, u_effect_seed);
                else if(u_active_effect == 8) effect_color = effect_Noise(final_color, uv, u_effect_seed);
                else if(u_active_effect == 9) effect_color = effect_Tear(uv, u_effect_seed);
                else if(u_active_effect == 10) effect_color = effect_Shear(uv, region, u_effect_seed);
                else if(u_active_effect == 11) effect_color = effect_Shear(uv, region, u_effect_seed);
                else if(u_active_effect == 12) effect_color = effect_SlitScan(uv, u_effect_seed);
                else if(u_active_effect == 13) effect_color = effect_SlitScan(uv, u_effect_seed);
                else if(u_active_effect == 15) effect_color = effect_ChromaticAberration(uv, u_effect_seed);
                else if(u_active_effect == 16) effect_color = effect_PixelStretch(uv, u_effect_seed);
                else if(u_active_effect == 17) effect_color = effect_Dither(final_color, uv, u_effect_seed);
                else if(u_active_effect == 18) effect_color = effect_SlitScanVertical(uv, u_effect_seed);
                else if(u_active_effect == 19) effect_color = effect_ScanlinesEffect(final_color, uv, u_effect_seed);
                else if(u_active_effect == 20) effect_color = effect_Jitter(uv, u_effect_seed);
                else if(u_active_effect == 21) effect_color = effect_HueCycle(final_color, u_effect_seed);
                else if(u_active_effect == 22) effect_color = effect_LCD(uv, u_effect_seed);
                else if(u_active_effect == 23) effect_color = effect_LCD(uv, u_effect_seed);
                else if(u_active_effect == 24) effect_color = effect_8Bit(final_color, u_effect_seed);
                else if(u_active_effect == 25) effect_color = effect_ASCII(uv, u_effect_seed);
                else if(u_active_effect == 26) effect_color = effect_PerlinNoise(uv, u_effect_seed);
                else if(u_active_effect == 27) effect_color = effect_LumaMesh(uv, u_effect_seed);
                else if(u_active_effect == 28) effect_color = effect_VHS(uv, final_color, u_effect_seed);
                else if(u_active_effect == 29) effect_color = effect_FindEdges(uv, u_effect_seed);
                else if(u_active_effect == 30) effect_color = effect_MovingLines(final_color, uv, u_effect_seed);
                else if(u_active_effect == 31) effect_color = effect_PencilSketch(uv, u_effect_seed);
                else if(u_active_effect == 32) effect_color = effect_PencilSketch(uv, u_effect_seed);
                else if(u_active_effect == 33) effect_color = effect_Glow(uv, u_effect_seed);
                else if(u_active_effect == 34) effect_color = effect_MeltingLines(uv, u_effect_seed);
                else if(u_active_effect == 35) effect_color = effect_MeltingLines(uv, u_effect_seed);
                else if(u_active_effect == 36) effect_color = effect_BlockDisplacement(uv, u_effect_seed);

            if (!u_apply_crt) {
                gl_FragColor = effect_color;

            float flicker = 1.0;
            if (!u_safe_mode) {

            phosphorColor *= flicker;

            gl_FragColor = vec4(phosphorColor, 1.0);
        }

                    u_phos_color: { value: new THREE.Vector3(0.9, 0.9, 0.9) }, 
                    u_v_offset: { value: 0.0 },
                    u_glitch_region: { value: new THREE.Vector4(0.0, 0.0, 1.0, 1.0) }
                },
                vertexShader: document.getElementById('vertexShader').textContent,
                fragmentShader: document.getElementById('fragmentShader').textContent
            });

            plane = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shaderMaterial);
            scene.add(plane);

            requestAnimationFrame(animate);
        }

        function updateTextLogic(timeSeconds) {
            tCtx.fillStyle = isPhotosensitiveMode ? 'rgba(0, 0, 0, 1)' : 'rgba(0, 0, 0, 0.15)'; 
            tCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);

            let offsetX = 0;
            if (!isPhotosensitiveMode && Math.random() > 0.9) {
                offsetX = (Math.random() - 0.5) * 5; 
            }

            // Draw images and their titles
            const cards = document.querySelectorAll('.artwork-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                // Check if card is in viewport
                if (rect.bottom > 0 && rect.top < window.innerHeight) {
                    if (!card.matches(':hover')) {
                        const img = card.querySelector('.artwork-image');
                        const title = card.querySelector('.artwork-title');
                        
                        if (img && img.complete && img.naturalWidth !== 0) {
                            const imgRect = img.getBoundingClientRect();
                            tCtx.drawImage(img, imgRect.left + offsetX, imgRect.top, imgRect.width, imgRect.height);
                        }
                        
                        if (title) {
                            const titleRect = title.getBoundingClientRect();
                            tCtx.font = '100 1rem "Roboto Condensed"';
                            tCtx.fillStyle = Math.random() > 0.8 ? '#AAAAAA' : '#FFFFFF';
                            tCtx.textAlign = 'left';
                            tCtx.textBaseline = 'top';
                            
                            const words = title.textContent.split(' ');
                            let line = '';
                            let yPos = titleRect.top;
                            const lineHeight = 22; // ~1.4 * 16px
                            const maxWidth = rect.width;

                            for (let n = 0; n < words.length; n++) {
                                // If a single word is insanely long, it will still render on one line, 
                                // but standard long titles will wrap properly.
                                const testLine = line + words[n] + ' ';
                                const metrics = tCtx.measureText(testLine);
                                const testWidth = metrics.width;
                                if (testWidth > maxWidth && n > 0) {
                                    tCtx.fillText(line, titleRect.left + offsetX, yPos);
                                    if (!isPhotosensitiveMode && Math.random() > 0.85) {
                                        tCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                                        tCtx.fillText(line, titleRect.left - (offsetX * 2), yPos);
                                        tCtx.fillStyle = Math.random() > 0.8 ? '#AAAAAA' : '#FFFFFF';
                                    }
                                    line = words[n] + ' ';
                                    yPos += lineHeight;
                                } else {
                                    line = testLine;
                                }
                            }
                            tCtx.fillText(line, titleRect.left + offsetX, yPos);
                            if (!isPhotosensitiveMode && Math.random() > 0.85) {
                                tCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                                tCtx.fillText(line, titleRect.left - (offsetX * 2), yPos);
                            }
                        }
                    }
                }
            });

            // Draw persistent UI
            const title = document.querySelector('h1');
            const backLink = document.querySelector('.back-link');
            const toggleBtn = document.getElementById('photosensitive-toggle');
            
            [title, backLink, toggleBtn].forEach(el => {
                if(!el) return;
                const rect = el.getBoundingClientRect();
                if (rect.bottom < 0 || rect.top > window.innerHeight) return;

                let textColor = Math.random() > 0.8 ? '#AAAAAA' : '#FFFFFF';
                if (el.id === 'photosensitive-toggle' && isPhotosensitiveMode) {
                    textColor = '#888888';
                }
                
                let fontSize = '24px';
                if (el.tagName === 'H1') fontSize = '2.5rem';
                
                tCtx.font = `300 ${fontSize} "Roboto Condensed"`;
                tCtx.fillStyle = textColor;
                tCtx.textAlign = 'center';
                tCtx.textBaseline = 'middle';
                
                let text = el.textContent;
                
                const centerX = rect.left + rect.width / 2 + offsetX;
                const centerY = rect.top + rect.height / 2;
                
                tCtx.fillText(text, centerX, centerY);

                if (!isPhotosensitiveMode && Math.random() > 0.85) {
                    tCtx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    tCtx.fillText(text, centerX - (offsetX * 2), centerY);
                }
            });

            // --- Per-artwork torus ring loaders drawn on canvas (glitch shader affects them) ---
            if (!window._imgTracked) {
                window._imgTracked = true;
                document.querySelectorAll('.artwork-image').forEach(img => {
                    img._loadStart = performance.now();
                    img._loaded = img.complete && img.naturalWidth > 0;
                    if (!img._loaded) {
                        img.addEventListener('load',  () => { img._loaded = true; });
                        img.addEventListener('error', () => { img._loaded = true; });
                    }
                });
            }
            document.querySelectorAll('.artwork-image').forEach(img => {
                if (img._loaded) return;
                const rect = img.getBoundingClientRect();
                if (rect.width === 0) return;
                const cx = rect.left + rect.width  / 2;
                const cy = rect.top  + rect.height / 2;
                const outer = rect.width * 0.12;
                const inner = outer * 0.65;
                const elapsed = performance.now() - (img._loadStart || performance.now());
                // Ease to ~90% over 4s; never reaches 100% until load event fires
                const p = 0.9 * (1 - Math.exp(-3 * elapsed / 4000));
                // Background track (dim hollow ring)
                tCtx.globalAlpha = 0.22;
                tCtx.beginPath();
                tCtx.arc(cx, cy, outer, 0, Math.PI * 2);
                tCtx.arc(cx, cy, inner, 0, Math.PI * 2, true);
                tCtx.fillStyle = '#FFFFFF';
                tCtx.fill('evenodd');
                // Progress fill clockwise from 12 o'clock
                if (p > 0.005) {
                    tCtx.globalAlpha = 0.92;
                    const a0 = -Math.PI / 2;
                    const a1 = a0 + Math.PI * 2 * p;
                    tCtx.beginPath();
                    tCtx.arc(cx, cy, outer, a0, a1);
                    tCtx.arc(cx, cy, inner, a1, a0, true);
                    tCtx.closePath();
                    tCtx.fillStyle = '#FFFFFF';
                    tCtx.fill();
                }
                tCtx.globalAlpha = 1;
            });
            textTexture.needsUpdate = true;
        }

        function animate(t) {
            const timeSeconds = t * 0.001;
            updateTextLogic(timeSeconds);
            shaderMaterial.uniforms.time.value = timeSeconds;

            effectTimer++;
            if (effectTimer > EFFECT_SWITCH_INTERVAL) {
                effectTimer = 0;

                const cards = Array.from(document.querySelectorAll('.artwork-card'));
                const title = document.querySelector('h1');
                const possibleTargets = [...cards, title];
                
                const visibleTargets = possibleTargets.filter(el => {
                    if(!el) return false;
                    const rect = el.getBoundingClientRect();
                    return rect.bottom > 0 && rect.top < window.innerHeight;
                });
                
                if (visibleTargets.length > 0) {
                    const target = visibleTargets[Math.floor(Math.random() * visibleTargets.length)];
                    const rect = target.getBoundingClientRect();
                    
                    const paddingX = 40; 
                    const paddingY = 20; 
                    
                    const nx = (rect.left - paddingX) / window.innerWidth;
                    const nw = (rect.width + paddingX * 2) / window.innerWidth;
                    
                    const ny = 1.0 - ((rect.top + rect.height + paddingY) / window.innerHeight);
                    const nh = (rect.height + paddingY * 2) / window.innerHeight;
                    
                    targetWordRect = { x: nx, y: ny, w: nw, h: nh };
                }

                if (Math.random() > 0.2) {
                    let nextEffect = Math.floor(Math.random() * TOTAL_EFFECTS) + 1;
                    activeEffects.unshift(nextEffect);
                    effectSeeds.unshift(Math.random());
                } else {
                    activeEffects.unshift(0); 
                    effectSeeds.unshift(Math.random());
                }
                activeEffects.length = 3; 
                effectSeeds.length = 3;
            }

            shaderMaterial.uniforms.u_glitch_region.value.set(targetWordRect.x, targetWordRect.y, targetWordRect.w, targetWordRect.h);
            
            // Pass 1
            shaderMaterial.uniforms.tDiffuse.value = textTexture;
            shaderMaterial.uniforms.u_active_effect.value = activeEffects[0];
            shaderMaterial.uniforms.u_effect_seed.value = effectSeeds[0];
            shaderMaterial.uniforms.u_apply_crt.value = false;
            renderer.setRenderTarget(rtA);
            renderer.render(scene, camera);

            // Pass 2
            shaderMaterial.uniforms.tDiffuse.value = rtA.texture;
            shaderMaterial.uniforms.u_active_effect.value = activeEffects[1];
            shaderMaterial.uniforms.u_effect_seed.value = effectSeeds[1];
            shaderMaterial.uniforms.u_apply_crt.value = false;
            renderer.setRenderTarget(rtB);
            renderer.render(scene, camera);

            // Pass 3 (Final)
            shaderMaterial.uniforms.tDiffuse.value = rtB.texture;
            shaderMaterial.uniforms.u_active_effect.value = activeEffects[2];
            shaderMaterial.uniforms.u_effect_seed.value = effectSeeds[2];
            shaderMaterial.uniforms.u_apply_crt.value = true;
            renderer.setRenderTarget(null);
            renderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        window.onresize = () => {
            if (renderer && camera && shaderMaterial) {
                const width = window.innerWidth;
                const height = window.innerHeight;
                const aspect = width / height;
                renderer.setSize(width, height);
                rtA.setSize(width, height);
                rtB.setSize(width, height);
                
                textCanvas.width = width;
                textCanvas.height = height;
                
                camera.updateProjectionMatrix();
                shaderMaterial.uniforms.aspect.value = aspect;
            }
        };

        document.getElementById('photosensitive-toggle').addEventListener('click', (e) => {
            isPhotosensitiveMode = !isPhotosensitiveMode;
            shaderMaterial.uniforms.u_safe_mode.value = isPhotosensitiveMode;
        });

        // --- PREVIEW WINDOW ACTIVATION ON MOUSE OVER / TOUCH ---
        // All art activates on mouse over: code runs in preview, animations play
        let activePreviewCard = null;
        let previewHoverTimer = null;

        function clearActivePreview() {
            clearTimeout(previewHoverTimer);
            if (!activePreviewCard) return;
            const container = activePreviewCard.querySelector('.artwork-preview');
            if (container) {
                const mediaEls = container.querySelectorAll('.artwork-preview-media');
                mediaEls.forEach(el => {
                    if (el.tagName === 'IFRAME') el.src = 'about:blank';
                    if (el.tagName === 'VIDEO') {
                        try { el.pause(); el.src = ''; } catch(e) {}
                    }
                    el.remove();
                });
            }
            activePreviewCard = null;
        }

        function activatePreview(card) {
            if (activePreviewCard === card) return;
            clearActivePreview();

            const container = card.querySelector('.artwork-preview');
            if (!container) return;

            activePreviewCard = card;

            // 1. Interactive code art (runs live in preview)
            if (card.dataset.generator) {
                const iframe = document.createElement('iframe');
                iframe.className = 'artwork-preview-media';
                iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-pointer-lock');
                iframe.setAttribute('allow', 'accelerometer; autoplay; encrypted-media; gyroscope');
                iframe.src = card.dataset.generator;
                container.appendChild(iframe);
                return;
            }

            // 2. Video animation (plays looping video)
            if (card.dataset.animation && card.dataset.animationType === 'video') {
                const video = document.createElement('video');
                video.className = 'artwork-preview-media';
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.src = card.dataset.animation;
                container.appendChild(video);
                video.play().catch(() => {});
                return;
            }

            // 3. GIF animation (plays animated GIF)
            if (card.dataset.animation && card.dataset.animationType === 'gif') {
                const gif = document.createElement('img');
                gif.className = 'artwork-preview-media';
                gif.crossOrigin = 'anonymous';
                gif.alt = card.querySelector('.artwork-image')?.alt || '';
                gif.src = card.dataset.animation;
                container.appendChild(gif);
                return;
            }
        }

        // --- FULLSCREEN GENERATIVE ART RUNNER MODAL ---
        const runnerModal = document.getElementById('runner-modal');
        const runnerIframe = document.getElementById('runner-iframe');
        const runnerTitle = document.getElementById('runner-title');
        const runnerNewtab = document.getElementById('runner-newtab');
        const runnerObjkt = document.getElementById('runner-objkt');
        const runnerClose = document.getElementById('runner-close');

        function openRunner(card) {
            if (!card.dataset.generator || !runnerModal) return;
            clearActivePreview();
            const titleEl = card.querySelector('.artwork-title');
            if (runnerTitle) runnerTitle.textContent = titleEl ? titleEl.textContent : '';
            if (runnerIframe) runnerIframe.src = card.dataset.generator;
            if (runnerNewtab) runnerNewtab.href = card.dataset.generator;
            if (runnerObjkt) runnerObjkt.href = card.href;
            runnerModal.style.display = 'block';
        }

        function closeRunner() {
            if (!runnerModal) return;
            runnerModal.style.display = 'none';
            if (runnerIframe) runnerIframe.src = 'about:blank';
        }

        if (runnerClose) runnerClose.addEventListener('click', closeRunner);
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && runnerModal && runnerModal.style.display === 'block') {
                closeRunner();
            }
        });

        // Bind hover and click events across all cards
        document.querySelectorAll('.artwork-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                clearTimeout(previewHoverTimer);
                previewHoverTimer = setTimeout(() => {
                    activatePreview(card);
                }, 60);
            });

            card.addEventListener('mouseleave', () => {
                clearTimeout(previewHoverTimer);
                if (activePreviewCard === card) {
                    clearActivePreview();
                }
            });

            // Touch / mobile activation
            card.addEventListener('touchstart', () => {
                if (card.dataset.generator || card.dataset.animation) {
                    if (activePreviewCard !== card) {
                        activatePreview(card);
                    }
                }
            }, { passive: true });

            card.addEventListener('click', (e) => {
                if (card.dataset.generator) {
                    e.preventDefault();
                    openRunner(card);
                }
            });
        });

        window.addEventListener('scroll', () => {
            if (activePreviewCard) {
                const rect = activePreviewCard.getBoundingClientRect();
                if (rect.bottom < 0 || rect.top > window.innerHeight) {
                    clearActivePreview();
                }
            }
        }, { passive: true });

        // --- IMAGE ERROR FALLBACK ---
        // If display_uri fails to load, try thumbnail, then hide gracefully
        document.querySelectorAll('.artwork-image').forEach(img => {
            if (img.complete && img.naturalWidth === 0) {
                if (img.dataset.thumbnail) img.src = img.dataset.thumbnail;
                else img.style.visibility = 'hidden';
            }
            img.addEventListener('error', function() {
                if (this.dataset.thumbnail && this.src !== this.dataset.thumbnail) {
                    this.src = this.dataset.thumbnail;
                } else {
                    this.style.visibility = 'hidden';
                }
            });
        });

        window.onload = init;
    </script>
<script>
        // Allow mouse back/forward buttons to navigate
        window.addEventListener('mouseup', (e) => {
            if (e.button === 3) window.history.back();
            if (e.button === 4) window.history.forward();
        });
    </script>
</body>
</html>
