name: Sync Artworks from Objkt

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-artworks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch curations and collection from Objkt
        run: node fetch_objkt.js

      - name: Regenerate gallery pages
        run: node regenerate.js

      - name: Commit and push changes if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            echo "New mints or curation updates detected."
            git add -A
            git commit -m "Auto-sync artworks from Objkt [skip ci]"
            git push
          else
            echo "No changes detected. Website is up to date."
          fi
